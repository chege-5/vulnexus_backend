  hardcoded_keys:
    - id: HARDCODED_AWS_ACCESS_KEY
      title: AWS access key ID detected
      category: Hardcoded keys
      severity: Critical
      confidence: 0.97
      cvss: 9.1
      languages: [generic]
      regex: "(?:AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{12,}"
      cwe: [CWE-798]
      owasp: A07 Identification and Authentication Failures
      recommendation: Remove the key, rotate it in AWS IAM, and inject credentials from a managed secret store.
      references: [https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html]
      enabled: true
    - id: HARDCODED_AWS_SECRET_KEY

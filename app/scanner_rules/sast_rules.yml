version: "2026.07-sast"
categories:
  application_security:
    - {id: SAST_PY_RANDOM_TOKEN, title: Insecure Python random token, category: Insecure randomness, description: random is unsuitable for secrets., severity: High, confidence: 0.9, cvss: 7.5, languages: [python], regex: "random\\.(?:choice|randint|random|choices).*?(?:token|secret|password|session)", cwe: [CWE-330], owasp: A02 Cryptographic Failures, recommendation: Use secrets module APIs, references: [https://cwe.mitre.org/data/definitions/330.html], enabled: true}
    - {id: SAST_PY_SUBPROCESS_SHELL, title: subprocess shell true, category: Command injection, description: shell=True can execute attacker-controlled input., severity: High, confidence: 0.94, cvss: 8.1, languages: [python], regex: "subprocess\\.(?:run|call|Popen|check_output)\\([^\\n]*shell\\s*=\\s*True", cwe: [CWE-78], owasp: A03 Injection, recommendation: Pass an argument list and keep shell disabled, references: [https://cwe.mitre.org/data/definitions/78.html], enabled: true}
    - {id: SAST_PY_EVAL, title: Python eval execution, category: Code injection, description: eval executes dynamic input., severity: High, confidence: 0.98, cvss: 8.1, languages: [python], regex: "\\beval\\s*\\(", cwe: [CWE-95], owasp: A03 Injection, recommendation: Replace eval with safe parsing, references: [https://cwe.mitre.org/data/definitions/95.html], enabled: true}
    - {id: SAST_PY_EXEC, title: Python exec execution, category: Code injection, description: exec executes dynamic code., severity: High, confidence: 0.98, cvss: 8.1, languages: [python], regex: "\\bexec\\s*\\(", cwe: [CWE-95], owasp: A03 Injection, recommendation: Remove dynamic code execution, references: [https://cwe.mitre.org/data/definitions/95.html], enabled: true}
    - {id: SAST_PY_PICKLE_LOADS, title: Unsafe pickle deserialization, category: Deserialization, description: pickle can execute attacker code., severity: High, confidence: 0.96, cvss: 8.1, languages: [python], regex: "pickle\\.loads?\\s*\\(", cwe: [CWE-502], owasp: A08 Software and Data Integrity Failures, recommendation: Use a safe serialization format, references: [https://cwe.mitre.org/data/definitions/502.html], enabled: true}
    - {id: SAST_PY_YAML_LOAD, title: Unsafe yaml load, category: Deserialization, description: yaml.load may construct unsafe objects., severity: High, confidence: 0.9, cvss: 7.5, languages: [python], regex: "yaml\\.load\\s*\\(", cwe: [CWE-502], owasp: A08 Software and Data Integrity Failures, recommendation: Use yaml.safe_load, references: [https://cwe.mitre.org/data/definitions/502.html], enabled: true}
    - {id: SAST_PY_REQUESTS_VERIFY_FALSE, title: TLS verification disabled, category: TLS misconfiguration, description: HTTPS certificate verification is disabled., severity: High, confidence: 0.96, cvss: 7.4, languages: [python], regex: "requests\\.(?:get|post|put|delete|request)\\([^\\n]*verify\\s*=\\s*False", cwe: [CWE-295], owasp: A02 Cryptographic Failures, recommendation: Keep certificate verification enabled, references: [https://cwe.mitre.org/data/definitions/295.html], enabled: true}
    - {id: SAST_PY_DEBUG_MODE, title: Python debug mode enabled, category: Security misconfiguration, description: Debug mode can expose internals., severity: Medium, confidence: 0.86, cvss: 5.3, languages: [python], regex: "(?:DEBUG|debug)\\s*=\\s*True", cwe: [CWE-489], owasp: A05 Security Misconfiguration, recommendation: Disable debug mode in production, references: [https://cwe.mitre.org/data/definitions/489.html], enabled: true}
    - {id: SAST_AWS_ACCESS_KEY, title: Hardcoded AWS access key, category: Hardcoded keys, description: AWS key material is embedded., severity: Critical, confidence: 0.99, cvss: 9.8, languages: [generic], regex: "AKIA[0-9A-Z]{16}", cwe: [CWE-798], owasp: A07 Identification and Authentication Failures, recommendation: Revoke and rotate the key, references: [https://cwe.mitre.org/data/definitions/798.html], enabled: true}
    - {id: SAST_GENERIC_API_KEY, title: Hardcoded API key, category: Hardcoded keys, description: API key is embedded in source., severity: High, confidence: 0.82, cvss: 7.5, languages: [generic], regex: "(?:api[_-]?key|apikey)\\s*[:=]\\s*[\"'][A-Za-z0-9_-]{16,}[\"']", cwe: [CWE-798], owasp: A07 Identification and Authentication Failures, recommendation: Move secrets to a manager, references: [https://cwe.mitre.org/data/definitions/798.html], enabled: true}
    - {id: SAST_JWT_SECRET, title: Hardcoded JWT secret, category: Hardcoded keys, description: JWT signing secret is embedded., severity: High, confidence: 0.9, cvss: 7.5, languages: [generic], regex: "(?:jwt[_-]?secret|secret[_-]?key)\\s*[:=]\\s*[\"'][^\"']{8,}[\"']", cwe: [CWE-798], owasp: A07 Identification and Authentication Failures, recommendation: Store a high entropy secret externally, references: [https://cwe.mitre.org/data/definitions/798.html], enabled: true}
    - {id: SAST_DATABASE_URL_PASSWORD, title: Database credentials in source, category: Hardcoded keys, description: Database connection credentials are embedded., severity: High, confidence: 0.9, cvss: 7.5, languages: [generic], regex: "(?:postgres|mysql|mongodb(?:\\+srv)?)://[^\\s:/]+:[^@\\s]+@", cwe: [CWE-798], owasp: A07 Identification and Authentication Failures, recommendation: Use environment or secret manager references, references: [https://cwe.mitre.org/data/definitions/798.html], enabled: true}
    - {id: SAST_JS_EVAL, title: JavaScript eval, category: Code injection, description: eval executes dynamic JavaScript., severity: High, confidence: 0.98, cvss: 8.1, languages: [javascript], regex: "\\beval\\s*\\(", cwe: [CWE-95], owasp: A03 Injection, recommendation: Remove eval, references: [https://cwe.mitre.org/data/definitions/95.html], enabled: true}
    - {id: SAST_JS_INNERHTML, title: Unsafe innerHTML, category: Cross site scripting, description: innerHTML can inject untrusted markup., severity: Medium, confidence: 0.82, cvss: 6.1, languages: [javascript], regex: "\\.innerHTML\\s*=", cwe: [CWE-79], owasp: A03 Injection, recommendation: Use safe DOM APIs and sanitize input, references: [https://cwe.mitre.org/data/definitions/79.html], enabled: true}
    - {id: SAST_NODE_EXEC, title: Node command execution, category: Command injection, description: child process execution is dangerous with input., severity: High, confidence: 0.9, cvss: 8.1, languages: [javascript], regex: "child_process\\.(?:exec|execSync)\\s*\\(", cwe: [CWE-78], owasp: A03 Injection, recommendation: Use execFile with an allowlist, references: [https://cwe.mitre.org/data/definitions/78.html], enabled: true}
    - {id: SAST_EXPRESS_PERMISSIVE_CORS, title: Permissive Express CORS, category: Security misconfiguration, description: CORS allows every origin., severity: Medium, confidence: 0.88, cvss: 5.3, languages: [javascript], regex: "cors\\s*\\(\\s*\\{?\\s*origin\\s*:\\s*['\"]?\\*", cwe: [CWE-942], owasp: A05 Security Misconfiguration, recommendation: Allow only trusted origins, references: [https://cwe.mitre.org/data/definitions/942.html], enabled: true}
    - {id: SAST_JWT_NONE, title: JWT none algorithm, category: Authentication, description: JWT algorithm none disables signing., severity: Critical, confidence: 0.96, cvss: 9.1, languages: [generic], regex: "(?:alg|algorithm)\\s*[:=]\\s*[\"']none[\"']", cwe: [CWE-347], owasp: A07 Identification and Authentication Failures, recommendation: Require a strong explicit signing algorithm, references: [https://cwe.mitre.org/data/definitions/347.html], enabled: true}
    - {id: SAST_SQL_CONCAT, title: SQL string concatenation, category: SQL injection, description: Query construction can inject SQL., severity: High, confidence: 0.8, cvss: 8.1, languages: [python, javascript, java], regex: "(?:SELECT|INSERT|UPDATE|DELETE).*(?:\\+|%s|f[\"'])", cwe: [CWE-89], owasp: A03 Injection, recommendation: Use parameterized queries, references: [https://cwe.mitre.org/data/definitions/89.html], enabled: true}
    - {id: SAST_PATH_TRAVERSAL, title: Path traversal input, category: Path traversal, description: User input is joined into a path., severity: High, confidence: 0.76, cvss: 7.5, languages: [python, javascript], regex: "(?:open|send_file|readFile)\\s*\\([^\\n]*(?:\\.\\./|path\\.join)", cwe: [CWE-22], owasp: A01 Broken Access Control, recommendation: Normalize and constrain paths to a base directory, references: [https://cwe.mitre.org/data/definitions/22.html], enabled: true}
    - {id: SAST_PRIVATE_KEY_BLOCK, title: Private key in source, category: Hardcoded keys, description: Private key material is committed., severity: Critical, confidence: 0.99, cvss: 9.8, languages: [generic], regex: "-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----", cwe: [CWE-321], owasp: A02 Cryptographic Failures, recommendation: Revoke and remove the private key, references: [https://cwe.mitre.org/data/definitions/321.html], enabled: true}
